name: Petsapp
description: PetsApp is a veterinary client engagement and practice communication platform used by more than
  1,000 veterinary practices worldwide, with millions of pets registered and millions of dollars in payments
  processed. It gives clinics two-way SMS and in-app messaging, appointment booking, video consultations,
  digital payments, wellness and health-care plan management, automated reminders, and a lightweight CRM for
  building client relationships. PetsApp does not publish a public developer portal or open API; API access
  and documentation are offered privately to technology and PIMS integration partners through its partner
  program, and its public docs subdomain is a Jira Service Management customer help center rather than API
  reference documentation.
